<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>NEXUS // LIFE OPERATIONS</title><style>:root{--bg:#090909;--p:#141414;--line:#39342f;--bone:#e8dfc9;--muted:#aaa398;--red:#c51f30;--amber:#d69a42;--green:#8eb79c}*{box-sizing:border-box}[hidden]{display:none!important}html{color-scheme:dark}body{margin:0;background:var(--bg);color:var(--bone);font:15px/1.6 system-ui,sans-serif}body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(transparent 0 3px,#0002 3px 4px);opacity:.25}a{color:inherit}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:3px}.mono,nav,button,.button,.eyebrow,.tag,label,small,footer{font-family:ui-monospace,Consolas,monospace}header{position:sticky;top:0;z-index:30;background:#090909f5;border-bottom:1px solid var(--line)}.top{max-width:1400px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{text-decoration:none;font-weight:800}.red{color:var(--red)}.amber{color:var(--amber)}nav{display:flex;gap:13px;flex-wrap:wrap;font-size:10px}nav a{text-decoration:none;color:var(--muted)}nav a[aria-current=page],nav a:hover{color:var(--amber)}.session{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{font-size:10px;border:1px solid var(--line);padding:4px 8px;color:var(--amber);display:inline-block}.bar{font:11px/1.8 monospace;border-bottom:1px solid var(--line);padding:8px 22px;text-align:center;color:var(--muted)}.bar.local{color:var(--amber);background:#d69a420a}main{max-width:1400px;margin:auto;padding:32px 22px;min-height:75vh}.panel{background:linear-gradient(135deg,#1b1b1b,#101010);border:1px solid var(--line);padding:22px;position:relative}.panel:before,.panel:after{content:'';position:absolute;width:9px;height:9px;pointer-events:none}.panel:before{left:-1px;top:-1px;border-left:2px solid var(--red);border-top:2px solid var(--red)}.panel:after{right:-1px;bottom:-1px;border-right:2px solid var(--red);border-bottom:2px solid var(--red)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--amber)}h1{font-size:clamp(30px,4vw,54px);line-height:1.08;letter-spacing:-1.5px;margin:20px 0}h2{line-height:1.25}p{color:var(--muted)}.gradient{background:linear-gradient(90deg,var(--red),var(--amber),var(--bone));background-clip:text;-webkit-background-clip:text;color:transparent}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button,.button{background:#171717;border:1px solid var(--line);color:var(--bone);padding:10px 13px;font-size:11px;text-decoration:none;display:inline-block;letter-spacing:.4px}button:hover,.button:hover{border-color:var(--amber)}.primary{background:var(--red);border-color:var(--red)}.small{padding:6px 9px;font-size:10px}.danger{color:#ff8d99}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:22px 0}.number{font:32px monospace;color:var(--amber);margin-top:12px}.notice{font:11px/1.8 monospace;border-left:2px solid var(--amber);padding-left:12px;color:var(--muted)}.gap{margin-top:24px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field label{font-size:11px;color:var(--amber)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);background:#090909;color:var(--bone)}textarea{min-height:110px;resize:vertical}.error{color:#ff8d99;font:12px/1.7 monospace}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:22px 0}.toolbar .field{margin:0;flex:1;min-width:140px}.item{border-bottom:1px solid var(--line);padding:16px 0}.item:last-child{border-bottom:0}.item h3{margin:4px 0}.done h3{text-decoration:line-through;color:var(--muted)}#terminalOutput{height:350px;overflow:auto;padding:18px;font:13px/1.8 monospace;white-space:pre-wrap;overflow-wrap:anywhere}.toast{position:fixed;bottom:22px;right:22px;z-index:100;max-width:calc(100% - 44px);padding:13px 18px;background:#161616;border:1px solid var(--amber);font:12px monospace}.toast:empty{display:none}dialog{color:var(--bone);background:#111;border:1px solid var(--amber);width:min(760px,calc(100% - 30px));max-height:90vh;padding:24px}dialog::backdrop{background:#000b}dialog h2{margin-top:0}.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.chart-wrap{margin-top:18px;padding:16px;background:#0d0d0d;border:1px solid var(--line)}.chart-bar-row{display:flex;align-items:center;gap:12px;margin:12px 0}.chart-label{width:160px;font:11px monospace;color:var(--muted)}.chart-track{flex:1;height:22px;background:#171717;border:1px solid var(--line);position:relative;overflow:hidden}.chart-fill{height:100%;transition:width .4s ease-out}.fill-green{background:var(--green)}.fill-red{background:var(--red)}.fill-amber{background:var(--amber)}.chart-val{width:90px;text-align:right;font:12px monospace;color:var(--bone)}.calc-box{background:#181818;border:1px solid var(--amber);padding:14px;margin:14px 0;font:12px monospace}</style></head><body><header><div class="top"><a class="brand mono" href="#/">wolf<span class="red">X</span>_Xsabyter</a><nav aria-label="Main navigation"><a href="#/dashboard" data-nav="dashboard">OVERVIEW</a><a href="#/income" data-nav="income">INCOME</a><a href="#/bills" data-nav="bills">BILLS</a><a href="#/tasks" data-nav="tasks">TASKS</a></nav><div class="session"><span class="tag" id="badge">LOCAL WORKSPACE</span></div></div></header><main id="main"><section class="page" data-page="dashboard"><div class="row"><div><span class="eyebrow">NEXUS // COORDINATED OVERVIEW</span><h1>CASH FLOW <span class="gradient">SYSTEM.</span></h1></div><div class="buttons"><button data-new="income" class="primary">+ LOG HOURS</button><button data-new="bill">+ BILL</button></div></div><div class="panel gap"><span class="eyebrow">FINANCIAL TELEMETRY // BANK LIQUIDITY</span><h2>Automated Cash Flow</h2><div id="cashFlowChart" class="chart-wrap"></div></div><div id="dashboardStats" class="stats"></div><div class="two gap"><div class="panel"><h2>Upcoming Bills</h2><div id="nextBills"></div></div><div class="panel"><h2>Paycheck History</h2><div id="incomeList"></div></div></div></section></main><div class="toast" id="toast"></div><dialog id="editor"><form id="recordForm"><div class="row"><h2 id="editTitle">Log Hours & Calculate Pay</h2><button type="button" id="closeEditor">✕</button></div><div id="editFields"></div><p id="editError" class="error"></p><div class="modal-footer"><button type="button" id="cancelEditor">CANCEL</button><button type="submit" id="saveRecord" class="primary">SAVE PAYCHECK</button></div></form></dialog><script>
'use strict';
(()=>{
const $=id=>document.getElementById(id);
let records=JSON.parse(localStorage.getItem('nexus_records')||'[]');
const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v)||0);
const sum=(arr,fn)=>arr.reduce((t,r)=>t+(Number(fn(r))||0),0);

function saveRecords(){localStorage.setItem('nexus_records',JSON.stringify(records));render();}

function openIncomeEditor(){
  const fields = $('editFields');
  fields.innerHTML = `
    <div class="field"><label>PAYCHECK TITLE / EMPLOYER</label><input name="title" value="Special Citizens Future Unlimited" required></div>
    <div class="field"><label>REGULAR HOURS (Base Rate: $18.31)</label><input name="reg_hours" type="number" step="0.01" value="78.77" required></div>
    <div class="field"><label>OVERTIME HOURS (1.5x Rate: $27.47)</label><input name="ot_hours" type="number" step="0.01" value="23.20"></div>
    <div class="field"><label>PTO HOURS ($18.31)</label><input name="pto_hours" type="number" step="0.01" value="8.00"></div>
    <div class="calc-box" id="calcSummary"></div>
  `;
  $('editor').showModal();
  
  const form = $('recordForm');
  const updateCalc = () => {
    const reg = +form.elements.reg_hours.value || 0;
    const ot = +form.elements.ot_hours.value || 0;
    const pto = +form.elements.pto_hours.value || 0;
    
    // Auto-calculated rates based on pay stub
    const gross = (reg * 18.31) + (ot * 27.47) + (pto * 18.31);
    const estTaxes = gross * 0.13153; // SS, Medicare, NY State, NYC Local, PFL
    const estDeductions = 297.12;     // Medical, Dental, Vision, Vol Life
    const net = Math.max(0, gross - estTaxes - estDeductions);
    
    $('calcSummary').innerHTML = `
      <strong>ESTIMATED GROSS:</strong> ${money(gross)}<br>
      <strong>AUTO TAXES (NYC/NYS/FICA ~13.15%):</strong> -${money(estTaxes)}<br>
      <strong>AUTO DEDUCTIONS (Benefits):</strong> -${money(estDeductions)}<br>
      <hr style="border-color:var(--line)">
      <span style="color:var(--green);font-size:14px;font-weight:bold;">ESTIMATED TAKE-HOME (BANK DEPOSIT): ${money(net)}</span>
    `;
    form.dataset.gross = gross;
    form.dataset.net = net;
  };
  
  form.oninput = updateCalc;
  updateCalc();
}

$('recordForm').onsubmit = (e) => {
  e.preventDefault();
  const f = e.target.elements;
  const newRec = {
    id: Date.now(),
    kind: 'income',
    title: f.title.value,
    status: 'done',
    payload: {
      reg_hours: +f.reg_hours.value,
      ot_hours: +f.ot_hours.value,
      pto_hours: +f.pto_hours.value,
      gross: +e.target.dataset.gross,
      net: +e.target.dataset.net
    }
  };
  records.push(newRec);
  saveRecords();
  $('editor').close();
};

document.querySelectorAll('[data-new="income"]').forEach(b=>b.onclick=openIncomeEditor);
$('closeEditor').onclick=$('cancelEditor').onclick=()=>$('editor').close();

function render(){
  const income = records.filter(r=>r.kind==='income');
  const totalNet = sum(income, r=>r.payload.net);
  const totalGross = sum(income, r=>r.payload.gross);
  
  const chartWrap = $('cashFlowChart');
  chartWrap.innerHTML = `
    <div class="chart-bar-row">
      <div class="chart-label">TOTAL GROSS EARNED</div>
      <div class="chart-track"><div class="chart-fill fill-amber" style="width:100%"></div></div>
      <div class="chart-val">${money(totalGross)}</div>
    </div>
    <div class="chart-bar-row">
      <div class="chart-label">NET TAKE-HOME IN BANK</div>
      <div class="chart-track"><div class="chart-fill fill-green" style="width:${totalGross ? (totalNet/totalGross)*100 : 0}%"></div></div>
      <div class="chart-val">${money(totalNet)}</div>
    </div>
  `;
  
  const list = $('incomeList');
  list.innerHTML = income.length ? '' : '<p class="notice">No hours logged yet.</p>';
  income.forEach(r => {
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = `
      <h3>${r.title}</h3>
      <p>Hours: ${(r.payload.reg_hours + r.payload.ot_hours + r.payload.pto_hours).toFixed(2)} hrs | Gross: ${money(r.payload.gross)}</p>
      <p style="color:var(--green);font-weight:bold;">Take-Home Deposit: ${money(r.payload.net)}</p>
    `;
    list.appendChild(d);
  });
}

render();
})();
</script></body></html>
